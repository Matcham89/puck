# Lint, test, build and push the services image, and keep a release PR (changelog + version) from Conventional Commits. Repo-agnostic: the image name defaults to this repository, the registry to GHCR,
# and GHCR needs no extra secret (the built-in GITHUB_TOKEN). To push elsewhere, see docs/getting-started.md.
name: ci
on:                        # CI (lint, test) on pull requests, pushes to main and manual runs; releases and image pushes only when the ref is main
  push:
    branches: [main]
  pull_request:
    paths-ignore:          # release PRs (opened by the bot, which GitHub makes wait for manual approval) only touch these two files
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a main run halfway through a release

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell
        run: shellcheck -S warning setup.sh deployment/kubernetes/*.sh deployment/kubernetes/*/*.sh application/tests/run.sh application/*.sh
      - name: Python compiles
        run: python3 -m compileall -q application tests
      - name: JSON
        run: jq empty deployment/kubernetes/app/catalog.example.json release-please-config.json .release-please-manifest.json
      - name: YAML
        run: pip install --quiet yamllint && yamllint deployment/kubernetes .github

  pr-title:                # squash merges use the PR title as the commit message, and that is what drives releases
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'learn/')   # the agent's own draft PRs are exempt
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|ci|build|test|refactor|perf|style|revert)(\([^)]+\))?!?: .+' \
            || { echo "PR title must be a Conventional Commit, e.g. 'feat: add x', 'fix(gate): y', 'feat!: breaking change'. Got: $TITLE"; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (loaded locally for the tests)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: application/Dockerfile
          load: true
          tags: eda-services:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests, inside the image
        run: sh application/tests/run.sh eda-services:test

  release-please:          # keeps a release PR open (version + CHANGELOG.md); merging it tags and publishes the GitHub Release
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'      # never on a PR (its ref is refs/pull/...) or a manual run on another branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN is enough, but PRs/tags it creates do not trigger other workflows; a PAT secret makes CI run on the release PR
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  push:                    # image push: only when the ref is main (the release tag is added when release-please cut a release)
    needs: [lint, test, release-please]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.release-please.result != 'failure' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write          # GHCR push with the built-in token
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registries want lowercase)
        run: echo "IMAGE=$(echo '${{ vars.IMAGE_NAME || github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release-please.outputs.tag_name || 'unreleased' }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: application/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
