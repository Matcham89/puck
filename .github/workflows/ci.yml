# Lint, test, build and push the services image. Repo-agnostic: the image name defaults to this repository, the registry to GHCR,
# and GHCR needs no extra secret (the built-in GITHUB_TOKEN). To push elsewhere, see docs/getting-started.md.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell
        run: shellcheck -S warning setup.sh deployment/kubernetes/*.sh deployment/kubernetes/*/*.sh application/tests/run.sh application/*.sh
      - name: Python compiles
        run: python3 -m compileall -q application tests
      - name: JSON
        run: jq empty deployment/kubernetes/app/catalog.example.json
      - name: YAML
        run: pip install --quiet yamllint && yamllint -d relaxed deployment/kubernetes .github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (loaded locally for the tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: application/Dockerfile
          load: true
          tags: eda-services:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests, inside the image
        run: sh application/tests/run.sh eda-services:test

  push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write          # GHCR push with the built-in token
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registries want lowercase)
        run: echo "IMAGE=$(echo '${{ vars.IMAGE_NAME || github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: application/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
