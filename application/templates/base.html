<!doctype html><html><head><meta charset="utf-8"><title>Event-Driven AI</title>
<script src="https://unpkg.com/htmx.org@2.0.3"></script>
<style>
body{font:14px system-ui;max-width:960px;margin:2rem auto;padding:0 1rem;color:#222}
table{width:100%;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #eee;text-align:left}
.s-in_progress{color:#0a58ca}.s-blocked{color:#b45f06}.s-finished{color:#188038}.s-failed{color:#c5221f}.s-cancelled{color:#777}
.stage{display:inline-block;padding:.2rem .5rem;margin:0 .2rem .2rem 0;border-radius:4px;background:#eee}.stage.cur{background:#0a58ca;color:#fff}.stage.done{background:#cfe8d5}
pre{background:#f6f6f6;padding:.6rem;overflow:auto;white-space:pre-wrap}.lvl-error{color:#c5221f}.lvl-warn{color:#b45f06}
.box{border:1px solid #f0c36d;background:#fff8e6;padding:.8rem;margin:1rem 0}
.s-queued{color:#777}.pass{color:#188038;font-weight:600}.fail{color:#c5221f;font-weight:600}.muted{color:#777}small.muted{font-size:12px}
#clock{float:right;font-size:13px;font-weight:400;color:#555;font-variant-numeric:tabular-nums}time.t{white-space:nowrap}
</style></head><body><h1><span id="clock" title="your time, then UTC"></span><a href="/" style="color:inherit;text-decoration:none">Event-Driven AI</a></h1>{% block body %}{% endblock %}
<script>
const when=(utc,onlyTime)=>{const d=new Date(utc);if(isNaN(d))return utc;
  return onlyTime?d.toLocaleTimeString([],{hour12:false}):d.toLocaleString([],{dateStyle:"medium",timeStyle:"short"})};
const localize=(root=document)=>root.querySelectorAll("time.t").forEach(t=>{t.textContent=when(t.dataset.utc,"onlyTime" in t.dataset)});
const tick=()=>{const d=new Date();document.getElementById("clock").textContent=
  d.toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZoneName:"short"})+" · UTC "+d.toISOString().slice(11,19)};
localize();tick();setInterval(tick,1000);
document.body.addEventListener("htmx:afterSwap",e=>localize(e.target));
</script></body></html>
